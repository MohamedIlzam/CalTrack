services:
  - type: web
    name: caltrack-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:render
    initialDeployHook: npm run seed:all
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PERSONALIZED_DATA_ENABLED
        value: "false"
      - key: GEMINI_PERSONALIZED_OPERATOR_CONFIRMATION
        sync: false
      - key: FRONTEND_URL
        sync: false
